name: fashionsaas-tryon-servicebus
services:
  servicebus-emulator:
    container_name: tryon-servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - ./servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: DevOnly_Passw0rd!
      ACCEPT_EULA: "Y"
    depends_on:
      - servicebus-sql
    networks:
      sb-emulator:
        aliases:
          - servicebus-emulator
  servicebus-sql:
    container_name: tryon-servicebus-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: DevOnly_Passw0rd!
    networks:
      sb-emulator:
        aliases:
          - servicebus-sql

networks:
  sb-emulator:
